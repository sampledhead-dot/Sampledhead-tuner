<style>:root{--bg:#0a0d11;--p1:#11161c;--p2:#182029;--p3:#202a35;--ln:#283441;--tx:#e8eef4;--mu:#8997a6;--acc:#2dd4bf;--acc-d:rgba(45,212,191,.16);--vio:#a78bfa;--tea:#2dd4bf;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--r:14px;--fs:15px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:var(--fs)/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body[data-tab=chords]{--acc:var(--vio);--acc-d:rgba(167,139,250,.16)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(10,13,17,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.logo{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-weight:700;letter-spacing:.2px}
.logo svg{flex:none}.logo b{font-weight:800}.logo small{color:var(--acc);font-weight:700;margin-left:4px;transition:color .2s}
.ib{min-width:38px;height:36px;border-radius:10px;background:var(--p2);border:1px solid var(--ln);display:grid;place-items:center;padding:0 8px;font-size:13px;font-weight:700}
.ib:active{background:var(--p3)}
.tabs{position:sticky;top:53px;z-index:19;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 10px;background:var(--bg)}
.tab{position:relative;height:44px;border-radius:12px;background:var(--p1);border:1px solid var(--ln);color:var(--mu);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.tab[data-c=tuner]{--c:var(--tea)}.tab[data-c=chords]{--c:var(--vio)}
.tab.on{color:var(--tx);border-color:var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,var(--p1)),var(--p1));box-shadow:0 0 0 1px var(--c) inset,0 4px 18px -8px var(--c);font-size:16px}
.tab i{width:8px;height:8px;border-radius:50%;background:var(--c);opacity:.5}.tab.on i{opacity:1;box-shadow:0 0 8px var(--c)}
.unit{max-width:640px;margin:0 auto;padding:4px 10px 90px}
.view{display:none}.view.on{display:block}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:var(--r);padding:12px;margin:0 0 10px;position:relative}
.card.rule::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
.row{display:flex;align-items:center;gap:8px}.row.w{flex-wrap:wrap}.grow{flex:1;min-width:0}
.h{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--acc);font-weight:800;margin:0 0 8px}
.mu{color:var(--mu)}.sm{font-size:12.5px}
.seg{display:flex;gap:4px;background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:3px}
.seg button{flex:1;min-width:0;height:36px;border-radius:9px;color:var(--mu);font-weight:700;font-size:13px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--acc);color:#06100f}
.seg.sm button{height:30px;font-size:12.5px}
.pick{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:6px 10px;border-radius:12px;background:var(--p2);border:1px solid var(--ln);text-align:left}
.pick .l{flex:1;min-width:0}.pick .l b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pick .l span{display:block;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .c{color:var(--mu)}
.star{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--mu);font-size:18px;flex:none}.star.on{color:var(--warn)}
.stp{display:flex;align-items:center;gap:2px;background:var(--p2);border:1px solid var(--ln);border-radius:12px;height:44px;flex:none}
.stp button{width:34px;height:42px;font-size:18px;color:var(--mu)}.stp span{min-width:48px;text-align:center;font-size:13px;line-height:1.1}.stp span small{display:block;color:var(--mu);font-size:10px}
.chip{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 11px;border-radius:16px;background:var(--p2);border:1px solid var(--ln);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--acc-d);border-color:var(--acc);color:var(--tx)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.btn{height:42px;padding:0 14px;border-radius:12px;background:var(--p2);border:1px solid var(--ln);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--acc);color:#06100f;border-color:transparent}
.btn.sm{height:34px;padding:0 10px;font-size:13px}
.btn:active{filter:brightness(.9)}.btn[disabled]{opacity:.4}
.sw{position:relative;width:44px;height:26px;border-radius:13px;background:var(--p3);border:1px solid var(--ln);flex:none}.sw::after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:var(--mu);transition:.15s}.sw.on{background:var(--acc-d);border-color:var(--acc)}.sw.on::after{left:20px;background:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc);height:28px}
select,input[type=text],input[type=number]{width:100%;height:40px;border-radius:10px;background:var(--p2);color:var(--tx);border:1px solid var(--ln);padding:0 10px;font:inherit}
/* tuner */
.gauge{padding:10px 12px 12px;text-align:center;overflow:hidden}
.gauge.ok{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset,0 0 26px -10px var(--ok)}
.bigNote{font-size:64px;line-height:1;font-weight:800;letter-spacing:-1px;min-height:64px;display:flex;align-items:flex-start;justify-content:center;gap:2px}
.bigNote sup{font-size:24px;margin-top:6px;color:var(--mu);font-weight:700}
.gauge.ok .bigNote{color:var(--ok)}
.gauge.idle .bigNote{color:var(--p3)}
.gauge canvas{display:block;width:100%;height:132px;margin:2px 0}
.gInfo{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--mu);min-height:20px}
.gInfo b{font-size:22px;color:var(--tx);font-weight:800}
.gHint{margin-top:4px;font-weight:800;font-size:17px;min-height:24px}
.gHint.up{color:var(--warn)}.gHint.dn{color:var(--bad)}.gHint.ok{color:var(--ok)}
.strs{display:flex;gap:6px;margin:0 0 10px}
.str{flex:1;min-width:0;padding:8px 2px 6px;border-radius:12px;background:var(--p1);border:1px solid var(--ln);text-align:center;position:relative;transition:.1s}
.str b{display:block;font-size:19px;line-height:1.1}.str b sub{font-size:11px;color:var(--mu);font-weight:600;vertical-align:baseline}
.str small{display:block;font-size:10px;color:var(--mu);margin-top:2px}
.str.sel{border-color:var(--acc);background:var(--acc-d)}
.str.hit{box-shadow:0 0 0 2px var(--acc) inset}
.str.tuned::after{content:"✓";position:absolute;right:5px;top:2px;font-size:11px;color:var(--ok);font-weight:800}
.lvl{height:8px;border-radius:4px;background:var(--p3);overflow:hidden}.lvl i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--warn) 80%,var(--bad));transition:width .06s}
.mic{height:50px;font-size:16px}
.stat{font-size:12px;color:var(--mu);margin-top:6px}
/* chords */
.chName{font-size:54px;line-height:1.05;font-weight:800;text-align:center;min-height:58px;word-break:break-word;letter-spacing:-.5px}
.chName.idle{color:var(--p3)}
.chNotes{text-align:center;color:var(--mu);font-size:15px;min-height:22px;margin-top:2px}
.chNotes b{color:var(--tx)}
.bar{height:6px;border-radius:3px;background:var(--p3);margin:10px 0 8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .15s}
.cands{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:32px}
.cands .chip{font-size:13px}
.hist{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.hist .chip{flex:none;background:var(--p2)}.hist .chip small{color:var(--mu);font-weight:500}
.diag{display:flex;flex-direction:column;align-items:center;gap:8px}
.diag svg{max-width:100%;height:auto}
.dg-s{fill:none;stroke:var(--mu);stroke-width:1.2}.dg-n{stroke:var(--tx);stroke-width:3}.dg-f{fill:none;stroke:var(--ln);stroke-width:1.2}
.dg-d{fill:var(--acc)}.dg-r{fill:var(--tx)}.dg-t{fill:var(--mu);font:10px system-ui}.dg-x{stroke:var(--mu);stroke-width:1.6;fill:none}
.pk-w{fill:#e8eef4;stroke:#222;stroke-width:1}.pk-b{fill:#10151a;stroke:#000}.pk-on{fill:var(--acc)}.pk-root{fill:var(--tx)}
.keyList{display:flex;flex-direction:column;gap:6px}
.keyRow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:var(--p2)}
.keyRow .bb{flex:1;height:6px;background:var(--p3);border-radius:3px;overflow:hidden}.keyRow .bb i{display:block;height:100%;background:var(--acc)}
.tl{overflow-x:auto;border-radius:10px;background:var(--p2);border:1px solid var(--ln)}
.tl canvas{display:block;height:84px;cursor:pointer}
.segl{display:flex;flex-direction:column;max-height:300px;overflow:auto;border-radius:10px;border:1px solid var(--ln)}
.segl button{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-bottom:1px solid var(--ln);text-align:left}.segl button.on{background:var(--acc-d)}.segl .tm{color:var(--mu);font-variant-numeric:tabular-nums;width:46px;font-size:12px}.segl b{min-width:70px}.segl .rn{color:var(--mu);font-size:12px;margin-left:auto}
.prog{height:6px;border-radius:3px;background:var(--p3);overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--acc)}
/* sections */
details.sec{background:var(--p1);border:1px solid var(--ln);border-radius:var(--r);margin:0 0 10px;position:relative}
details.sec>summary{list-style:none;cursor:pointer;padding:12px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--acc);font-weight:800;display:flex;align-items:center;justify-content:space-between}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"▾";color:var(--mu);transition:.15s}details.sec[open]>summary::after{transform:rotate(180deg)}
details.sec>.in{padding:0 12px 12px}
details.sec::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
.rootRow{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}.rootRow button{height:34px;border-radius:8px;background:var(--p2);border:1px solid var(--ln);font-size:12px;font-weight:700}.rootRow button.on{background:var(--acc);color:#06100f;border-color:transparent}
.nt{display:flex;gap:4px;flex-wrap:wrap}.nt span{min-width:34px;text-align:center;padding:4px 6px;border-radius:8px;background:var(--p2);font-weight:700;font-size:13px}.nt span.r{background:var(--acc);color:#06100f}
/* sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:88vh;background:var(--p1);border:1px solid var(--ln);border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sh-h{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--ln)}.sh-h b{flex:1;font-size:16px}
.sh-b{padding:10px 12px 18px;overflow:auto;flex:1}

async function analyzeFile(file){

    const kc=new Float64Array(12), kb=new Float64Array(12); for(let i=0;i<nF;i++){ if(rmsDb[i]<maxDb-42) continue; for(let p=0;p<12;p++){ kc[p]+=chroma[i][p]; kb[p]+=bass[i].conf>0.25?bass[i].pc[p]/(1e-9+bass[i].pc.reduce(function(s,v){return s+v;},0)):0; } }
    const keys=SHD.rankScales(kc,kb,TH.SC,5);
    FA.res={segs:out,keys:keys,dur:dur,name:file.name,tune:delta}; FA.sel=0;
    setProg(1,t('done')+(Math.abs(delta)>8?' · '+t('tuneEst')+': '+(delta>0?'+':'')+delta.toFixed(0)+' '+t('cents'):'')); renderFileRes(); updKey(true);
  }catch(e){ if(e.message!=='cancel'){ const st=$('#fStat'); if(st) st.textContent=t('fileErr')+(e.message||e); } }
  FA.busy=false;
}
function fmtT(s){ const m=Math.floor(s/60), x=s-m*60; return m+':'+(x<10?'0':'')+x.toFixed(1); }
function renderFileRes(){
  const r=FA.res; if(!r) return; $('#fRes').classList.remove('hide');
  const cv=$('#tlCv'); const box=$('#tl'); const W=Math.max(box.clientWidth||300,Math.ceil(r.dur*FA.pps)), H=84; const dpr=1; cv.width=W; cv.height=H; cv.style.width=W+'px';
  const g=cv.getContext('2d'); g.clearRect(0,0,W,H); g.font='bold 12px system-ui'; g.textBaseline='middle';
  const sc=W/r.dur;

  g.fillStyle='#8997a6'; g.font='10px system-ui'; for(let sx=0;sx<r.dur;sx+=Math.max(5,Math.ceil(r.dur/20/5)*5)){ g.fillText(Math.floor(sx/60)+':'+('0'+Math.floor(sx%60)).slice(-2),sx*sc+2,H-4); }
  const l=$('#segl'); l.innerHTML=r.segs.map(function(s,i){ if(s.n) return ''; const rn=CS.keyTopF?'':''; return '<button data-act="seg" data-i="'+i+'"><span class="tm">'+fmtT(s.t0)+'</span><b>'+esc(chName(s.r,s.tid,s.bass))+'</b><span class="rn">'+esc(fileRoman(s))+'</span></button>'; }).join('');
  updKey(true);
}
function fileRoman(s){ const k=FA.res&&FA.res.keys&&FA.res.keys[0]; if(!k||TH.SCI[k.id].iv.length!==7) return ''; return TH.roman(s.r,k.root,s.tid); }
function filePos(){ if(!FA.playing) return FA.off; return Math.min(FA.res?FA.res.dur:0,FA.off+(Eng.ctx.currentTime-FA.start)); }
function playFile(from){
  if(!FA.buf) return; const ctx=Eng.ensureCtx(); stopSrc(); const src=ctx.createBufferSource(); src.buffer=FA.buf; src.connect(ctx.destination); FA.off=Math.max(0,Math.min(from==null?FA.off:from,FA.buf.duration-0.05)); src.start(0,FA.off); FA.start=ctx.currentTime; FA.playing=true; FA.src=src; src.onended=function(){ if(FA.src===src){ FA.playing=false; FA.off=0; $('#fPlayB')&&($('#fPlayB').textContent='▶'); } }; $('#fPlayB').textContent='⏸';
}
function stopSrc(){ if(FA.src){ try{ FA.src.onended=null; FA.src.stop(); }catch(e){} FA.src=null; } }
function pauseFile(){ if(!FA.playing) return; FA.off=filePos(); FA.playing=false; stopSrc(); const b=$('#fPlayB'); if(b) b.textContent='▶'; }
function stopFile(){ stopSrc(); FA.playing=false; FA.off=0; const b=$('#fPlayB'); if(b) b.textContent='▶'; }
function fileLoop(){
  requestAnimationFrame(fileLoop); if(S.tab!=='chords'||S.cMode!=='file'||!FA.res) return;
  const pos=filePos(); const cur=$('#tlCur'); if(!cur) return; const sc=($('#tlCv').width)/FA.res.dur; cur.style.left=(pos*sc)+'px'; const ft=$('#fTime'); if(ft) ft.textContent=fmtT(pos)+' / '+fmtT(FA.res.dur);
  const box=$('#tl'); if(FA.playing){ const x=pos*sc; if(x>box.scrollLeft+box.clientWidth*0.85||x<box.scrollLeft) box.scrollLeft=Math.max(0,x-box.clientWidth*0.2); }
  let ci=-1; FA.res.segs.forEach(function(s,i){ if(!s.n&&pos>=s.t0&&pos<s.t1) ci=i; });
  if(ci!==FA.ci){ FA.ci=ci; $$('#segl button').forEach(function(b){ b.classList.toggle('on',+b.dataset.i===ci); }); const on=$('#segl button.on'); if(on&&FA.playing){ const L=$('#segl'); L.scrollTop=on.offsetTop-L.clientHeight/2; } if(ci>=0&&FA.playing){ const s=FA.res.segs[ci]; CS.sel={r:s.r,tid:s.tid,bass:s.bass}; CS.fi=0; renderDiagram(); } }
}
function exportFile(kind){
  const r=FA.res; if(!r) return; const base=(r.name||'chords').replace(/\.[^.]+$/,'');
  let data,mime,ext; const L=r.segs.filter(function(s){return !s.n;});
  if(kind==='txt'){ data=L.map(function(s){ return fmtT(s.t0)+'\t'+chName(s.r,s.tid,s.bass); }).join('\n'); mime='text/plain'; ext='txt'; }
  else{ data=JSON.stringify({file:r.name,duration:r.dur,keys:r.keys.slice(0,3).map(function(k){return {root:TH.pcName(k.root,nmOpts(null)),scale:k.id,score:+k.sc.toFixed(3)};}),chords:L.map(function(s){ return {start:+s.t0.toFixed(2),end:+s.t1.toFixed(2),chord:chName(s.r,s.tid,s.bass)}; })},null,1); mime='application/json'; ext='json'; }
  dl(new Blob([data],{type:mime}),base+'_chords.'+ext);
}
function dl(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500); }

const GUIDE=[
['Qué es','What it is',
'<p>SampledHead Tuner es la app hermana del Sampler y del Editor: un <b>afinador de precisión</b> y un <b>detector de acordes y escalas</b>. Todo se calcula en tu dispositivo; el audio no sale de él.</p><p>Tiene dos pestañas: <b>Afinador</b> (turquesa) y <b>Acordes</b> (violeta). Los ajustes (⚙), el idioma y esta guía están en la barra superior.</p>',
'<p>SampledHead Tuner is the sister app of the Sampler and the Editor: a <b>precision tuner</b> and a <b>chord and scale detector</b>. Everything is computed on your device; audio never leaves it.</p><p>Two tabs: <b>Tuner</b> (teal) and <b>Chords</b> (violet). Settings (⚙), language and this guide live in the top bar.</p>'],
['Primeros pasos y micrófono','Getting started and microphone',
'<p>Pulsa <b>Activar micrófono</b> y acepta el permiso. La app pide al navegador la señal <b>sin cancelación de eco, sin reducción de ruido y sin control automático de ganancia</b>, porque esos filtros estropean la medida del tono.</p><ul><li>En Ajustes puedes elegir otra <b>entrada</b> (interfaz USB, entrada de línea, micro externo). En Android, una interfaz USB suele aparecer como micrófono; en iOS Safari solo se usa la entrada predeterminada.</li><li>El micrófono se mantiene al cambiar de pestaña y se pausa si la app pasa a segundo plano.</li><li>Hace falta abrir la app desde <b>HTTPS</b> (GitHub Pages sirve) o desde localhost.</li></ul>',
'<p>Press <b>Enable microphone</b> and accept the permission. The app asks the browser for the signal <b>without echo cancellation, noise suppression or automatic gain</b>, since those filters distort pitch measurement.</p><ul><li>In Settings you can choose another <b>input</b> (USB interface, line in, external mic). On Android a USB interface usually shows up as a microphone; on iOS Safari only the default input is used.</li><li>The microphone stays on when you switch tabs and pauses when the app goes to the background.</li><li>The app must be opened over <b>HTTPS</b> (GitHub Pages works) or localhost.</li></ul>'],
['Afinador: instrumentos y afinaciones','Tuner: instruments and tunings',
'<p>Elige <b>Guitarra</b> (6, 7 u 8 cuerdas), <b>Bajo</b> (4, 5 o 6), <b>Ukelele</b>, <b>Banjo</b> (5 y 4 cuerdas) o <b>Cromático</b>. El botón de afinación abre una lista por categorías con buscador.</p><ul><li><b>Guitarra:</b> Estándar, Open D, Open C y Open G van primero; después Open E/A/Em/Dm/Gm/Am, DADGAD, Drop D, Doble Drop D, Drop C/C♯/B/A, medio tono y uno, uno y medio o dos tonos abajo, Nashville, Nueva estándar y las de 7 y 8 cuerdas.</li><li><b>Bajo:</b> EADG, Drop D, E♭, D, Drop C, piccolo, BEADG, EADGC, BEADGC y Drop A.</li><li><b>Ukelele:</b> GCEA, Sol grave, barítono, re (ADF♯B), Open G y sopranino.</li><li><b>Banjo:</b> Open G, Doble C, Sawmill, Open D, Estándar C, Open G menor, tenor irlandés, tenor Chicago y plectro.</li></ul><p><b>★ Favoritas:</b> toca la estrella de cualquier afinación y aparecerá arriba del todo. <b>＋ Crear afinación propia:</b> escribe el nombre y las notas de grave a agudo (<i>D2 A2 D3 G3 B3 E4</i>); se guarda y puedes marcarla como favorita o borrarla.</p><p><b>Cejilla (capo):</b> los botones − / + suben todas las cuerdas objetivo hasta 12 trastes.</p>',
'<p>Choose <b>Guitar</b> (6, 7 or 8 strings), <b>Bass</b> (4, 5 or 6), <b>Ukulele</b>, <b>Banjo</b> (5- and 4-string) or <b>Chromatic</b>. The tuning button opens a categorized list with search.</p><ul><li><b>Guitar:</b> Standard, Open D, Open C and Open G come first; then Open E/A/Em/Dm/Gm/Am, DADGAD, Drop D, Double Drop D, Drop C/C♯/B/A, half, whole, 1½ and 2 steps down, Nashville, New Standard and the 7- and 8-string ones.</li><li><b>Bass:</b> EADG, Drop D, E♭, D, Drop C, piccolo, BEADG, EADGC, BEADGC and Drop A.</li><li><b>Ukulele:</b> GCEA, low G, baritone, D tuning (ADF♯B), Open G and sopranino.</li><li><b>Banjo:</b> Open G, Double C, Sawmill, Open D, Standard C, Open G minor, Irish tenor, Chicago tenor and plectrum.</li></ul><p><b>★ Favorites:</b> tap the star on any tuning and it appears at the very top. <b>＋ Create custom tuning:</b> type a name and the notes low to high (<i>D2 A2 D3 G3 B3 E4</i>); it is saved and can be starred or deleted.</p><p><b>Capo:</b> the − / + buttons raise all target strings, up to 12 frets.</p>'],
['Leer el afinador','Reading the tuner',
'<p>La nota grande es la <b>cuerda objetivo</b>. La aguja marca la desviación en <b>cents</b> (100 cents = un semitono): a la izquierda, la nota está baja (sube la cuerda); a la derecha, alta (aflójala). Cuando la desviación entra en la tolerancia (±3 ¢ por defecto) el indicador se pone verde con «✓ Afinada».</p><ul><li><b>Auto:</b> la app detecta qué cuerda estás tocando (la más cercana). <b>Manual:</b> toca una cuerda de la fila para fijarla; suena un tono de referencia.</li><li><b>Tono continuo:</b> mantiene sonando la nota de la cuerda elegida para afinar de oído.</li><li><b>Estroboscopio</b> (Ajustes › Indicador): franjas que se detienen cuando la afinación es exacta, más fino que la aguja.</li><li><b>La4:</b> 440 Hz por defecto; también 415 (barroco), 432, 442, 444 o cualquier valor entre 392 y 466.</li></ul><div class="note">Consejo: toca la cuerda con fuerza una vez y déjala sonar. Los primeros milisegundos del ataque son inestables; la lectura se estabiliza en una fracción de segundo.</div>',
'<p>The big note is the <b>target string</b>. The needle shows the deviation in <b>cents</b> (100 cents = one semitone): left means the note is flat (tune up); right means sharp (loosen). When the deviation is within tolerance (±3 ¢ by default) the display turns green with “✓ In tune”.</p><ul><li><b>Auto:</b> the app detects which string you play (the nearest). <b>Manual:</b> tap a string in the row to lock it; a reference tone plays.</li><li><b>Hold tone:</b> keeps the chosen string’s note sounding so you can tune by ear.</li><li><b>Strobe</b> (Settings › Indicator): stripes that stand still when tuning is exact, finer than the needle.</li><li><b>A4:</b> 440 Hz by default; also 415 (baroque), 432, 442, 444 or any value from 392 to 466.</li></ul><div class="note">Tip: pluck the string firmly once and let it ring. The first milliseconds of the attack are unstable; the reading settles within a fraction of a second.</div>'],
['Cómo mide el afinador','How the tuner measures',
'<p>El detector combina un algoritmo de periodicidad tipo <b>YIN</b> (rápido y robusto ante octavas erróneas) con un <b>ajuste fino en frecuencia</b>: busca los armónicos de la cuerda, estima su <b>inarmonicidad</b> (las cuerdas gruesas suenan algo «agudas» en los armónicos altos) y calcula la frecuencia fundamental ideal. En señales sintéticas el error es inferior a 1,2 cents desde 30 Hz hasta 1 kHz. Funciona aunque el micro del móvil apenas capte la fundamental de las cuerdas graves, porque se apoya en los armónicos.</p>',
'<p>The detector combines a <b>YIN</b>-style periodicity algorithm (fast, robust against octave errors) with a <b>fine frequency fit</b>: it finds the string’s partials, estimates their <b>inharmonicity</b> (thick strings ring slightly sharp in the upper partials) and computes the ideal fundamental. On synthetic signals the error is below 1.2 cents from 30 Hz to 1 kHz. It works even when a phone mic barely picks up the fundamental of low strings, since it relies on the partials.</p>'],
['Cromático y escala','Chromatic and scale',
'<p>El modo <b>Cromático</b> muestra la nota más cercana a lo que suena, de unos 20 Hz a 4 kHz. Abre la sección <b>Escala</b>, elige tónica y escala y activa «Marcar si la nota está en la escala»: verás ✓ cuando la nota pertenece a la escala y un aviso cuando no.</p>',
'<p><b>Chromatic</b> mode shows the nearest note to whatever sounds, from about 20 Hz to 4 kHz. Open the <b>Scale</b> section, choose a root and scale and enable “Flag notes that are in the scale”: you get ✓ when the note belongs to the scale and a warning when it does not.</p>'],
['Detector de acordes en vivo','Live chord detector',
'<p>En <b>Acordes › En directo</b> activa el micrófono y toca. Verás el acorde (por ejemplo <i>Am7/G</i>), sus notas, el bajo detectado, una barra de coincidencia y las <b>alternativas</b> más probables (toca una para ver su diagrama).</p><ul><li><b>Detalle:</b> <i>Simple</i> (mayores y menores), <i>Normal</i> (añade séptimas, dim, aug, sus y power chords) y <i>Detallado</i> (sextas, novenas, m7♭5, dim7, 7♭9, 7♯9…).</li><li><b>Inversiones:</b> si el bajo es otra nota del acorde se muestra como <i>C/E</i>.</li><li><b>Historial:</b> los últimos acordes; <i>Copiar</i> los pasa al portapapeles.</li><li><b>Grado:</b> en números romanos respecto a la tonalidad estimada (por ejemplo <i>♭VII</i>).</li></ul><p>El motor usa un cromagrama armónico de picos espectrales con <b>compensación automática de afinación</b> (si tu instrumento está medio tono bajo o desafinado 30 cents, lo compensa), análisis independiente del bajo, plantillas con armónicos y un filtro de histéresis para que el nombre no parpadee.</p>',
'<p>In <b>Chords › Live</b> enable the microphone and play. You will see the chord (e.g. <i>Am7/G</i>), its notes, the detected bass, a match bar and the most likely <b>alternatives</b> (tap one to see its diagram).</p><ul><li><b>Detail:</b> <i>Simple</i> (major and minor), <i>Normal</i> (adds 7ths, dim, aug, sus and power chords) and <i>Detailed</i> (6ths, 9ths, m7♭5, dim7, 7♭9, 7♯9…).</li><li><b>Inversions:</b> when the bass is another chord tone it is shown as <i>C/E</i>.</li><li><b>History:</b> the latest chords; <i>Copy</i> puts them on the clipboard.</li><li><b>Degree:</b> Roman numerals relative to the estimated key (e.g. <i>♭VII</i>).</li></ul><p>The engine uses a harmonic chromagram built from spectral peaks with <b>automatic tuning compensation</b> (if your instrument is a half step low or 30 cents off, it compensates), independent bass analysis, harmonic templates and hysteresis so the name does not flicker.</p>'],
['Escalas y favoritas','Scales and favorites',
'<p>La sección <b>Escala</b> (en Afinador › Cromático y en Acordes) ofrece <b>más de 60 escalas</b> en 10 familias: básicas, modos griegos, pentatónicas y blues, modos de la menor armónica y melódica, simétricas, bebop, exóticas, japonesas y asiáticas, árabes, indias y flamenca (frigio dominante). Se pueden buscar por nombre o alias («hijaz», «gitana», «Ionian»…).</p><ul><li><b>☆ Favoritas:</b> pulsa la estrella junto a la escala (o dentro del selector) y se guarda arriba, en «★ Favoritas».</li><li>Se muestran sus <b>notas</b> con la tónica resaltada, su fórmula en semitonos y, si tiene 7 notas, sus <b>acordes diatónicos</b> (tócalos para ver el diagrama).</li><li><b>Favorecer acordes de esta escala:</b> inclina la detección hacia acordes que pertenecen a la escala. Útil si ya conoces la tonalidad; con la intensidad alta puede forzar errores si tocas fuera de ella.</li><li><b>Tonalidad / escala probable:</b> mientras tocas, la app puntúa todas las escalas en las 12 tónicas y te muestra las 3–4 más probables; <i>Usar</i> la fija como escala activa.</li></ul>',
'<p>The <b>Scale</b> section (in Tuner › Chromatic and in Chords) offers <b>more than 60 scales</b> in 10 families: basic, Greek modes, pentatonic & blues, harmonic- and melodic-minor modes, symmetrical, bebop, exotic, Japanese & Asian, Arabic, Indian and flamenco (Phrygian dominant). Search by name or alias (“hijaz”, “gypsy”, “Ionian”…).</p><ul><li><b>☆ Favorites:</b> tap the star next to the scale (or inside the picker) and it is stored at the top, under “★ Favorites”.</li><li>Its <b>notes</b> are shown with the root highlighted, its semitone formula and, if it has 7 notes, its <b>diatonic chords</b> (tap one to see the diagram).</li><li><b>Favour chords from this scale:</b> biases detection toward chords inside the scale. Handy when you know the key; at high strength it can force errors if you play outside it.</li><li><b>Likely key / scale:</b> while you play, the app scores every scale on all 12 roots and shows the 3–4 most likely ones; <i>Use</i> sets it as the active scale.</li></ul>'],
['Diagramas de acordes','Chord diagrams',
'<p>Cada acorde detectado (o elegido) se dibuja en <b>guitarra, bajo, ukelele, banjo o piano</b>. Las digitaciones se calculan para la <b>afinación que tengas elegida</b> en el Afinador (incluida una propia), con un máximo de 4 trastes de extensión, cejillas contadas como un dedo y la nota grave adecuada. <i>Otra digitación</i> recorre las mejores. <i>▶ Escuchar</i> toca el acorde con un sonido sintético.</p>',
'<p>Each detected (or chosen) chord is drawn for <b>guitar, bass, ukulele, banjo or piano</b>. Fingerings are computed for the <b>tuning chosen</b> in the Tuner (including a custom one), within a 4-fret span, barres counted as one finger and the right bass note. <i>Another fingering</i> cycles through the best ones. <i>▶ Listen</i> plays the chord with a synthetic sound.</p>'],
['Analizar un archivo','Analyzing a file',
'<p>En <b>Acordes › Archivo</b> elige una canción o grabación (audio o vídeo que tu navegador pueda decodificar). La app la analiza entera en el dispositivo: dibuja una <b>línea de tiempo de acordes</b>, estima la <b>tonalidad y escala</b> y compensa la afinación del disco. Para suavizar el resultado usa un algoritmo de <b>Viterbi</b> sobre todo el archivo, de modo que los cambios de acorde son más estables que en directo.</p><ul><li>Toca la línea de tiempo o una fila de la lista para saltar; ▶ reproduce y sigue el acorde actual con su diagrama.</li><li><b>Exportar .txt / .json</b> guarda los tiempos y los acordes.</li><li>El nivel de <i>Detalle</i> y el filtro de escala se aplican también al análisis; cámbialos y vuelve a elegir el archivo para recalcular.</li></ul>',
'<p>In <b>Chords › File</b> pick a song or recording (audio or video your browser can decode). The app analyzes all of it on the device: it draws a <b>chord timeline</b>, estimates the <b>key and scale</b> and compensates for the recording’s tuning. To smooth the result it runs a <b>Viterbi</b> pass over the whole file, so chord changes are steadier than live.</p><ul><li>Tap the timeline or a list row to jump; ▶ plays and follows the current chord with its diagram.</li><li><b>Export .txt / .json</b> saves times and chords.</li><li>The <i>Detail</i> level and the scale filter also apply to the analysis; change them and pick the file again to recompute.</li></ul>'],
['Ajustes y copia de seguridad','Settings and backup',
'<p>⚙ reúne: idioma (ES/EN), nombres de notas (letras o Do Re Mi), alteraciones (automático, ♯ o ♭), La4, tolerancia, sensibilidad (umbral de entrada: súbela si el ruido de fondo mueve la aguja, bájala si no capta cuerdas débiles), indicador (aguja o estroboscopio), entrada de audio, pantalla siempre encendida, compensación de afinación para grabaciones y <b>copia de seguridad</b> (exporta/importa favoritas, afinaciones propias y ajustes en un .json).</p>',
'<p>⚙ gathers: language (ES/EN), note names (letters or Do Re Mi), accidentals (automatic, ♯ or ♭), A4, tolerance, sensitivity (input threshold: raise it if background noise moves the needle, lower it if weak strings are missed), indicator (needle or strobe), audio input, keep screen on, tuning compensation for recordings and <b>backup</b> (export/import favorites, custom tunings and settings as a .json).</p>'],
['Consejos y límites','Tips and limits',
'<ul><li>Un acorde es una mezcla de notas: la detección es <b>probabilística</b>. Con guitarras muy distorsionadas, mucho reverb o varios instrumentos a la vez, espera dudas entre acordes parecidos (por ejemplo C6 y Am7 tienen las mismas notas; decide el bajo).</li><li>Para acordes en directo, deja sonar el acorde 1–2 segundos y evita ruido de fondo. Con grabaciones, usa el modo Archivo: es más estable.</li><li>Un teléfono apenas capta bien por debajo de 80 Hz; para bajo conviene un micro cerca del altavoz o, mejor, una interfaz de línea.</li><li>Los <b>power chords</b> (solo raíz y quinta) se detectan como «5» en los niveles Normal y Detallado.</li><li>Las pruebas internas se hicieron con señales sintéticas; el comportamiento con instrumentos reales puede requerir ajustar sensibilidad y tolerancia.</li></ul>',
'<ul><li>A chord is a blend of notes: detection is <b>probabilistic</b>. With heavily distorted guitars, lots of reverb or several instruments at once, expect doubts between similar chords (e.g. C6 and Am7 share the same notes; the bass decides).</li><li>For live chords, let the chord ring 1–2 seconds and avoid background noise. For recordings, use File mode: it is steadier.</li><li>A phone barely picks up anything below 80 Hz; for bass, a mic close to the speaker or, better, a line interface helps.</li><li><b>Power chords</b> (root and fifth only) are detected as “5” in the Normal and Detailed levels.</li><li>Internal tests were run on synthetic signals; behaviour with real instruments may need sensitivity and tolerance adjustments.</li></ul>'],
['Atajos (ordenador)','Shortcuts (desktop)',
'<ul><li><kbd>Espacio</kbd> activar / detener el micrófono</li><li><kbd>T</kbd> Afinador · <kbd>C</kbd> Acordes</li><li><kbd>A</kbd> alternar Auto / Manual en el afinador</li><li><kbd>Esc</kbd> cerrar ventanas</li></ul>',
'<ul><li><kbd>Space</kbd> enable / stop the microphone</li><li><kbd>T</kbd> Tuner · <kbd>C</kbd> Chords</li><li><kbd>A</kbd> toggle Auto / Manual in the tuner</li><li><kbd>Esc</kbd> close dialogs</li></ul>']
];
function openGuide(){
  const en=LANG==='en'; const h='<div class="guide">'+GUIDE.map(function(g,i){ return '<h3>'+(i+1)+'. '+esc(en?g[1]:g[0])+'</h3>'+(en?g[3]:g[2]); }).join('')+'</div>';
  openSheet(t('guide'),h);
}
/* ===== Idioma, pestañas, eventos ===== */
function applyLang(){
  document.documentElement.lang=LANG;
  $('#tabT').lastChild.textContent=t('tuner'); $('#tabC').lastChild.textContent=t('chords');
  $('#langB').textContent=(LANG==='es'?'🇪🇸 ES':'🇬🇧 EN'); $('#setB').setAttribute('aria-label',t('settings')); $('#gdB').setAttribute('aria-label',t('guide'));
  renderTuner(); renderChords(); refreshScale();
}
function setTab(k){
  if(S.tab===k&&$('#vTuner').classList.contains('on')===(k==='tuner')) return;
  S.tab=k; save(); if(k!=='tuner') droneSet(null); const db=$('#droneBtn'); if(db) db.classList.remove('pri');
  document.body.dataset.tab=k; $('#tabT').classList.toggle('on',k==='tuner'); $('#tabC').classList.toggle('on',k==='chords');
  $('#vTuner').classList.toggle('on',k==='tuner'); $('#vChords').classList.toggle('on',k==='chords');
  if(k==='chords'&&S.cMode==='file'&&FA.res) renderFileRes();
}
function targetNow(){ const tg=targets(); if(!tg.length) return null; return tg[(S.auto&&TS.valid&&TS.tgt>=0)?Math.min(TS.tgt,tg.length-1):Math.min(S.sel,tg.length-1)]; }
const ACT={
  tab:function(a){ setTab(a.dataset.v); },
  closeSheet:closeSheet,
  settings:openSettings, guide:openGuide,
  lang:function(){ LANG=LANG==='es'?'en':'es'; S.lang=LANG; save(); applyLang(); },
  inst:function(a){ S.inst=a.dataset.v; S.sel=0; resetTS(); droneSet(null); save(); renderTuner(); },
  capo:function(a){ S.capo=Math.max(0,Math.min(12,S.capo+(+a.dataset.v))); resetTS(); droneSet(null); save(); renderTuner(); },
  str:function(a){ const i=+a.dataset.i; S.sel=i; S.auto=false; save(); const tg=targets(); const s=tg[i]; if(!s) return; if(_drone){ droneSet(s.f); } else playTone(s.f,2); renderTuner(); },
  auto:function(a){ S.auto=a.dataset.v==='1'; save(); renderTuner(); },
  drone:function(a){ if(_drone){ droneSet(null); a.classList.remove('pri'); } else { const s=targetNow(); if(!s) return; droneSet(s.f); a.classList.add('pri'); } },
  pickTun:pickTun, newTun:newTun, saveTun:saveTun,
  mic:async function(){ if(Eng.on){ Eng.stop(); resetTS(); setLevel(-100); renderMic(); updTunerUI(); } else { const ok=await Eng.start(); renderMic(); } },
  tScale:function(){ S.tScale=!S.tScale; S.fold.tscale=true; save(); renderTuner(); },
  sroot:function(a){ S.scale.root=+a.dataset.v; save(); refreshScale(); },
  pickScale:pickScale, playScale:playScale,
  favScale:function(){ const i=S.fav.sc.indexOf(S.scale.id); if(i>=0) S.fav.sc.splice(i,1); else S.fav.sc.push(S.scale.id); save(); refreshScale(); },
  scOn:function(){ S.scaleOn=!S.scaleOn; S.fold.cscale=true; save(); refreshScale(); renderHist(); },
  scChord:function(a){ CS.sel={r:+a.dataset.r,tid:a.dataset.t,bass:null}; CS.fi=0; renderDiagram(); },
  useKey:function(a){ S.scale.root=+a.dataset.r; S.scale.id=a.dataset.id; save(); refreshScale(); toast(TH.pcName(S.scale.root,nmOpts(null))+' '+scName(TH.SCI[S.scale.id])); },
  cmode:function(a){ S.cMode=a.dataset.v; save(); if(S.cMode==='live') pauseFile(); renderChords(); },
  clevel:function(a){ S.cLevel=+a.dataset.v; save(); CS.tr.reset(); CS.lastKey=''; renderChords(); },
  cinst:function(a){ S.cInst=a.dataset.v; CS.fi=0; save(); renderDiagram(); },
  otherFing:function(){ CS.fi++; renderDiagram(); },
  hearChord:function(){ if(CS.play) playMidis(CS.play,0.05,2.4,S.a4); },
  copyHist:function(){ const s=CS.hist.map(function(h){return chName(h.r,h.tid,h.bass);}).join(' | '); if(navigator.clipboard) navigator.clipboard.writeText(s).then(function(){ toast(t('copied')); }); },
  clearHist:function(){ CS.hist=[]; CS.lastKey=''; CS.tr.reset(); renderHist(); },
  pickFile:function(){ $('#fileIn').click(); },
  fplay:function(){ if(FA.playing) pauseFile(); else playFile(); },
  fstop:stopFile,
  seg:function(a){ const s=FA.res.segs[+a.dataset.i]; CS.sel={r:s.r,tid:s.tid,bass:s.bass}; CS.fi=0; renderDiagram(); playFile(s.t0); },
  expTxt:function(){ exportFile('txt'); }, expJson:function(){ exportFile('json'); },
  set:function(a){ const k=a.dataset.k; let v=a.dataset.v; if(k==='tol') v=+v; applySet(k,v); },
  toggle:function(a){ const k=a.dataset.k; S[k]=!S[k]; save(); a.classList.toggle('on',S[k]); if(k==='wake') wakeSet(Eng.on); },
  a4:function(a){ S.a4=+a.dataset.v; save(); resetTS(); openSettings(); renderTuner(); },
  refDevs:refDevs, bkExp:backupExport, bkImp:function(){ $('#bkIn').click(); },
  resetAll:function(){ if(confirm(t('resetQ'))){ localStorage.removeItem(KEY); S=JSON.parse(JSON.stringify(DEF)); LANG=S.lang||(/^es/i.test(navigator.language)?'es':'en'); closeSheet(); setTab('tuner'); applyLang(); } }
};
function init(){
  loadS(); LANG=S.lang||(/^es/i.test(navigator.language||'')?'es':'en');
  SHD.initTemplates(TH.CT);
  document.addEventListener('click',function(e){ const a=e.target.closest('[data-act]'); if(!a) return; const f=ACT[a.dataset.act]; if(f){ e.preventDefault(); f(a,e); } });
  document.addEventListener('input',function(e){ const el=e.target; if(el.dataset.in==='scStr'){ S.scStr=+el.value; save(); const lb=el.parentNode.querySelector('label'); if(lb) lb.textContent=t('scaleStr')+' · '+Math.round(S.scStr*100)+'%'; return; }
    if(el.dataset.set){ const k=el.dataset.set; if(k==='a4'){ const v=parseFloat(el.value); if(v>=392&&v<=466){ S.a4=v; save(); resetTS(); } } else if(k==='gate'){ S.gate=+el.value; save(); const lb=el.parentNode.querySelector('label'); if(lb) lb.textContent=t('gate')+' · '+t('gateV').replace('{v}',S.gate); } } });
  document.addEventListener('change',function(e){ const el=e.target; if(el.id==='fileIn'&&el.files[0]){ analyzeFile(el.files[0]); el.value=''; } else if(el.id==='bkIn'&&el.files[0]){ backupImport(el.files[0]); el.value=''; } else if(el.dataset.set==='devId'){ applySet('devId',el.value); } else if(el.dataset.set==='a4'){ renderTuner(); } });
  document.addEventListener('click',function(e){ const s=e.target.closest('details.sec'); });
  document.addEventListener('toggle',function(e){ const d=e.target; if(d.dataset&&d.dataset.fold){ S.fold[d.dataset.fold]=d.open; save(); } },true);
  $('#tl') ; document.addEventListener('click',function(e){ const cv=e.target.closest('#tlCv'); if(cv&&FA.res){ const r=cv.getBoundingClientRect(); const tt=(e.clientX-r.left)/r.width*FA.res.dur; playFile(tt); } });
  document.addEventListener('keydown',function(e){
    const tg=e.target.tagName; if(tg==='INPUT'||tg==='SELECT'||tg==='TEXTAREA') return;
    if(e.key==='Escape') closeSheet();
    else if(e.key===' '){ e.preventDefault(); ACT.mic(); }
    else if(e.key==='t'||e.key==='T') setTab('tuner'); else if(e.key==='c'||e.key==='C') setTab('chords');
    else if(e.key==='a'||e.key==='A'){ if(S.tab==='tuner'&&S.inst!=='chrom'){ S.auto=!S.auto; save(); renderTuner(); } }
  });
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ if(Eng.on){ Eng.stream.getAudioTracks().forEach(function(tr){ tr.enabled=false; }); } pauseFile(); droneSet(null); const db=$('#droneBtn'); if(db) db.classList.remove('pri'); }
    else{ if(Eng.on){ Eng.stream.getAudioTracks().forEach(function(tr){ tr.enabled=true; }); if(Eng.ctx) Eng.ctx.resume().catch(function(){}); resetTS(); CS.tr.reset(); wakeSet(true); } }
  });
  $('#langB').addEventListener('click',ACT.lang);
  document.body.dataset.tab=S.tab; $('#vTuner').classList.toggle('on',S.tab==='tuner'); $('#vChords').classList.toggle('on',S.tab==='chords'); $('#tabT').classList.toggle('on',S.tab==='tuner'); $('#tabC').classList.toggle('on',S.tab==='chords');
  applyLang();
  setInterval(tunerFrame,55); setInterval(chordFrame,110); gaugeLoop(); fileLoop();
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function(){});
}
window.addEventListener('DOMContentLoaded',init);


</script></body></html>
